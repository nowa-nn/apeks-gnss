server {
    listen 80 default_server;
    server_name 130.49.149.59;
    root /var/www/apeks;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    server_name 130.49.149.59;
    ssl_certificate /etc/letsencrypt/live/130.49.149.59/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/130.49.149.59/privkey.pem;

    location = / { return 302 https://nowa-nn.github.io/apeks-gnss/; }
    location /static/ {
        alias /var/lib/apeks/uploads/;
        add_header X-Content-Type-Options nosniff;
    }
    location /app {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Set-Cookie "lng=ru; Path=/app; SameSite=Lax; Secure" always;
    }
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
